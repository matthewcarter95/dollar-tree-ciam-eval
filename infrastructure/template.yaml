AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Auth0-protected chatbot — BFF Lambda + DynamoDB
  NOTE: Lambda Function URL is intentionally OMITTED from this template.
  The org hook AWS::EarlyValidation::PropertyValidation blocks Function URLs in CloudFormation.
  Run scripts/post-deploy.sh after deploying this stack to attach the Function URL and create
  the CloudFront distribution.

Parameters:
  Auth0Domain:
    Type: String
    Description: Auth0 tenant domain (e.g. my-tenant.us.auth0.com)
  Auth0ClientId:
    Type: String
    Description: Auth0 application Client ID
  Auth0ClientSecret:
    Type: String
    NoEcho: true
    Description: Auth0 application Client Secret
  SessionSecret:
    Type: String
    NoEcho: true
    Description: Random 32+ char string for session encryption
  AppHostname:
    Type: String
    Default: smitty.demo-connect.us
  ApiHostname:
    Type: String
    Default: smitty-api.demo-connect.us
  Auth0Connection:
    Type: String
    Default: DT
    Description: >
      Auth0 connection NAME (e.g. "DT"), NOT the connection ID (con_xxx).
      The /authorize endpoint accepts names only — using a con_xxx ID causes
      "the connection is not enabled" even when the connection is correctly
      enabled in the dashboard. Leave blank for universal login.
  Auth0CanonicalDomain:
    Type: String
    Default: myid-selfservice.cic-demo-platform.auth0app.com
    Description: Canonical Auth0 tenant domain — used for Management API and MyAccount audience (never the custom domain)
  BedrockModelId:
    Type: String
    Default: amazon.nova-micro-v1:0
  Auth0CibaClientId:
    Type: String
    Description: Client ID for the DT CIBA M2M client
    Default: ''
  Auth0CibaClientSecret:
    Type: String
    NoEcho: true
    Description: Client Secret for the DT CIBA M2M client
    Default: ''
  Auth0CibaAudience:
    Type: String
    Default: https://smitty.demo-connect.us/purchases
    Description: Audience (DT Purchases API identifier)
  CartMergeSecret:
    Type: String
    NoEcho: true
    Description: Shared secret used by the Auth0 Post-Login Action to call /api/cart/merge

  PactEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Turns on the PACT Provider (/a2a, /api/platforms) and Brand login (/pact/*). Off by default.
  PactSsmPrefix:
    Type: String
    Default: /dollar-treasure/pact
    AllowedPattern: "^/[A-Za-z0-9_./-]+[^/]$"
    Description: SSM prefix; the signing key is the SecureString at <prefix>/signing-key
  PactBrandId:
    Type: String
    Default: 01M3R53Q5XD7T2VYB6ZC9D0HEK
    Description: Provider-assigned Brand id; part of the interface URL, so changing it breaks registrations
  PactAllowedIssuers:
    Type: String
    Default: ''
    Description: Comma-separated personal-agent issuers allowed to self-register. Empty allows any issuer that proves it holds its key.

Globals:
  Function:
    Timeout: 120
    MemorySize: 512
    Runtime: nodejs20.x
    Environment:
      Variables:
        AUTH0_DOMAIN: !Ref Auth0Domain
        AUTH0_CLIENT_ID: !Ref Auth0ClientId
        AUTH0_CLIENT_SECRET: !Ref Auth0ClientSecret
        SESSION_SECRET: !Ref SessionSecret
        APP_HOSTNAME: !Ref AppHostname
        API_HOSTNAME: !Ref ApiHostname
        AUTH0_CONNECTION: !Ref Auth0Connection
        AUTH0_CANONICAL_DOMAIN: !Ref Auth0CanonicalDomain
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        AUTH0_CIBA_CLIENT_ID: !Ref Auth0CibaClientId
        AUTH0_CIBA_CLIENT_SECRET: !Ref Auth0CibaClientSecret
        AUTH0_CIBA_AUDIENCE: !Ref Auth0CibaAudience
        DYNAMODB_SESSIONS_TABLE: !Ref SessionsTable
        DYNAMODB_CONVERSATIONS_TABLE: !Ref ConversationsTable
        DYNAMODB_CARTS_TABLE: !Ref CartsTable
        CART_MERGE_SECRET: !Ref CartMergeSecret
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
        PACT_ENABLED: !Ref PactEnabled
        PACT_BRAND_ID: !Ref PactBrandId
        PACT_TABLE: !Ref PactTable
        PACT_SIGNING_KEY_SSM_PARAMETER: !Sub '${PactSsmPrefix}/signing-key'
        PACT_ALLOWED_ISSUERS: !Ref PactAllowedIssuers

Resources:

  # ---- DynamoDB ----

  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-sessions'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: sid
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: userId-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: sid-index
          KeySchema:
            - AttributeName: sid
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ConversationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-conversations'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: conversationId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: conversationId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: userId-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  CartsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-carts'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Everything the PACT Provider stores: personal agents, conversations, device codes, grants.
  # Single table (pk, sk); TTL expires conversations, device codes and spent tokens.
  PactTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-pact'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ---- Lambda ----
  # IMPORTANT: No FunctionUrlConfig here — added post-deploy via scripts/post-deploy.sh
  # Reason: org hook AWS::EarlyValidation::PropertyValidation blocks Function URLs in CFN

  BackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-backend'
      CodeUri: ../backend/dist/
      Handler: lambda.handler
      Description: BFF for Auth0-protected chatbot
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CartsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PactTable
        # Read only the PACT signing key. A SecureString under the default aws/ssm key decrypts
        # with the caller's SSM access; no separate kms:Decrypt grant is needed.
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PactSsmPrefix}/signing-key'
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - arn:aws:dynamodb:us-east-1:204352680806:table/ucp-merchant-server-orders
                - arn:aws:dynamodb:us-east-1:204352680806:table/ucp-merchant-server-orders/index/buyer-sub-index
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - arn:aws:lambda:us-east-1:204352680806:function:RetailLoyaltyPointsTracker
                - arn:aws:lambda:us-east-1:204352680806:function:RetailPointsCoupon

Outputs:
  BackendFunctionArn:
    Description: Lambda function ARN — pass to post-deploy.sh
    Value: !GetAtt BackendFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-BackendFunctionArn'

  SessionsTableName:
    Value: !Ref SessionsTable

  ConversationsTableName:
    Value: !Ref ConversationsTable

  CartsTableName:
    Value: !Ref CartsTable

  PactTableName:
    Value: !Ref PactTable
